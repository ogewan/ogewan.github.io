# .portfolio.yml — canonical template
#
# Drop this file at the root of any public repo you want surfaced on the
# portfolio. The manifest builder fetches it via GitHub's GraphQL API on
# every workflow run; unknown keys fail validation, so use this template
# as the source of truth for which fields exist.
#
# Schema source: packages/manifest-builder/src/schema.ts (Zod, .strict()).

# Schema version — currently 3. Bumped only on breaking schema changes.
schema_version: 3

# Required UUID v4. Stable cross-reference identifier — config.json points at
# manifest entries by uuid (e.g. for the timeline or current_focus selection),
# so this must not change once published. Generate with `uuidgen` or any v4 tool.
uuid: 00000000-0000-4000-8000-000000000000

# Required string. 1–120 chars. Card heading + detail page <h1>.
title: Atlas Console

# Required string. 10–280 chars. Card body + detail-page lead. Tweet-length-cap
# keeps cards visually even.
summary: Real-time mission console for crewed launches. P99 latency ≤ 16ms across 28 consoles in 2 ground stations.

# Required string array, ≥1 entry. Free-form (not enum) — the shell shows
# usage frequency so typos surface during review.
tech:
  - react
  - r3f
  - typescript
  - protobuf
  - rust

# Optional string array, default []. Free-form. Used for the /projects filter pills.
categories:
  - aerospace
  - real-time

# Required enum: active | shipped | archived | experimental | wip
# - active: in active development, currently used
# - shipped: launched and stable, no longer actively iterated
# - archived: dormant or end-of-life
# - experimental: prototype / spike, may not survive
# - wip: work-in-progress, not yet shipped
# `in-progress` is NOT a valid value — use `wip`.
status: active

# Optional boolean, default false. Featured entries sort first and span the
# full grid width on /projects.
featured: true

# Optional integer. Among featured entries, lower numbers sort first. Useful
# for pinning a specific project as the hero card. Among non-featured entries,
# secondary sort is by GitHub `pushed_at` descending.
order: 1

# Optional string. Owner's role on this project (e.g. "Lead engineer"). Surfaces
# in the project detail spec table and — when this entry is current_focus — in
# the Hero block on Home.
# role: Lead engineer

# Required ISO calendar date (YYYY-MM-DD). Day-level precision; full timestamps fail.
started_at: 2024-03-15

# Optional ISO calendar date (YYYY-MM-DD). Set this when a project ships or wraps.
# ended_at: 2025-08-20

# Optional URL. If set, the project card's primary affordance becomes
# `Live · domain.so ↗` and the detail page gets an "Open live site" button
# that triggers a cross-document View Transition. Omit to keep readers in-shell.
pages_url: https://atlas-console.example.com

# Optional URL. Surfaces a play button on the detail-page Walkthrough section.
demo_video: https://www.youtube.com/watch?v=...

# Optional. Card hero — accepts an image (png/jpg/gif/webp) or a video
# (mp4/webm). Same path rules as `media`. When a video is provided, the card
# autoplays it muted and looping (respecting prefers-reduced-motion).
# hero: docs/screenshots/hero.png

# Optional repo-relative paths OR absolute http(s) URLs. Resolved to
# raw.githubusercontent.com by the manifest builder. Accepts a mix of images
# (png/jpg/gif/webp) and videos (mp4/webm); type is inferred from the file
# extension at render time. Rendered as the project gallery on the detail page.
media:
  - docs/screenshots/console-launch.png
  - docs/screenshots/console-anomaly.png
  - docs/media/walkthrough.mp4

# Optional URL. Long-form writeup link surfaced as a "Writeup ↗" action.
docs_link: https://atlas-console.example.com/docs/architecture

# Optional. Generic project page rendered at /projects/<repo>. Use this when
# a project doesn't have its own standalone github.io site; if `pages_url` is
# set, the case_study is bypassed entirely (the card links to the live site
# and /projects/<repo> shows a thin spec-only view). All slots are optional —
# include only what fits the project. Per-field locale dicts: `es` is
# optional and falls back to `en` at render time.
#
# case_study:
#   background:
#     en:
#       - "Lead paragraph in English."
#       - "Second paragraph."
#     es:
#       - "Lead paragraph en español."
#   pull_quote:
#     en: "Design for the room, not the window."
#   numbers:
#     - value: "14ms"
#       label: { en: "P99 latency" }
#     - value: "28"
#       label: { en: "Consoles", es: "Consolas" }
#   approach:
#     body:
#       en: "Three commitments before touching pixels."
#     steps:
#       - { en: "Lock the grid before lighting it." }
#       - { en: "Every cell is a question, not a datum." }
#   walkthrough_caption:
#     en: "Demo · 2:14"
